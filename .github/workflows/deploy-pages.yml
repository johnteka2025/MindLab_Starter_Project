name: Deploy MindLab Frontend to GitHub Pages

on:
  push:
    branches:
      - mindlab_age_modes_kids_first_2026_03_26
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mindlab-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Print diagnostics
        run: |
          pwd
          ls -la
          ls -la frontend
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --package-lock=false

      - name: Build frontend for GitHub Pages
        working-directory: frontend
        run: npm run build -- --base=/MindLab_Starter_Project/

      - name: Add nojekyll marker
        run: touch frontend/dist/.nojekyll

      - name: Verify build output
        run: |
          test -f frontend/dist/index.html
          ls -la frontend/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
