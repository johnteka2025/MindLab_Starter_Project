name: MindLab CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show versions
        shell: pwsh
        run: |
          node -v
          npm -v
          git --version

      - name: Run project gates
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          & ".\tools\RUN_ALL_GATES.ps1"
